name: Project checks
description: Set up the pinned tools and run the same quality checks as local development.

runs:
    using: composite
    steps:
        - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
          with:
              version: "0.11.1"
              python-version: "3.11"
              enable-cache: false
        - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
          with:
              node-version: "24"
              cache: npm
        - name: Install formatting dependencies
          shell: bash
          run: npm ci --ignore-scripts
        - name: Quality checks
          shell: bash
          run: npm run check
