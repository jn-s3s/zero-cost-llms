name: Stale model or rate-limit snapshot
description: Report a hand-saved capture that no longer matches a provider's models or limits.
title: "Stale snapshot: "
labels: []
body:
    - type: input
      id: snapshot-file
      attributes:
          label: Snapshot filename
          description: The affected `data_templates/*.html` path.
          placeholder: data_templates/google_rate_limits.html
      validations:
          required: true
    - type: input
      id: provider-id
      attributes:
          label: Provider id
          description: Which provider's published list or limits look wrong?
      validations:
          required: true
    - type: textarea
      id: mismatch
      attributes:
          label: Observed mismatch
          description: Name affected model ids or rate limits and explain what the capture shows instead.
      validations:
          required: true
    - type: input
      id: source-url
      attributes:
          label: Current source page URL
          description: "The signed-in `auth: true` `other_source` page, if available."
      validations:
          required: false
