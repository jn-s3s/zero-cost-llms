name: Fetch models

on:
    schedule:
        - cron: "0 0 * * *"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: models-data-updates
    cancel-in-progress: false

jobs:
    fetch-models:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - name: Set up uv
              uses: astral-sh/setup-uv@v6
            - name: Seed the output with the published data
              id: seed
              run: |
                  set -o pipefail
                  mkdir -p "$RUNNER_TEMP/model-output"
                  remote_branch=$(git ls-remote --heads origin refs/heads/models-data)
                  if [[ -z "$remote_branch" ]]; then
                    echo 'No models-data branch yet, fetching into an empty output.'
                    exit 0
                  fi
                  git fetch --no-tags origin +refs/heads/models-data:refs/remotes/origin/models-data
                  # A branch bootstrapped from another tree can exist without any
                  # data/ directory, which is as nothing-to-seed as no branch at all.
                  if [[ -z "$(git ls-tree --name-only refs/remotes/origin/models-data data)" ]]; then
                    echo 'models-data has no data/ tree, fetching into an empty output.'
                    exit 0
                  fi
                  # Unpack into a scratch directory first, so an archive that fails
                  # halfway cannot leave a truncated file to be published.
                  mkdir -p "$RUNNER_TEMP/models-data-seed"
                  git archive refs/remotes/origin/models-data data \
                    | tar -x --strip-components=1 -C "$RUNNER_TEMP/models-data-seed"
                  cp -a "$RUNNER_TEMP/models-data-seed/." "$RUNNER_TEMP/model-output/"
            - name: Fetch models
              id: fetch
              env:
                  AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
                  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
                  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
                  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
                  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
                  QODER_ACCESS_TOKEN: ${{ secrets.QODER_ACCESS_TOKEN }}
              run: uv run python fetch_models.py --output "$RUNNER_TEMP/model-output"
            - name: Generate provisional coding tiers and evidence views
              id: rankings
              continue-on-error: true
              run: uv run python generate_benchmark_rankings.py --input "$RUNNER_TEMP/model-output" --output "$RUNNER_TEMP/model-output"
            - name: Report benchmark status and issues
              env:
                  RANKING_OUTCOME: ${{ steps.rankings.outcome }}
              run: |
                  if [[ "$RANKING_OUTCOME" == "failure" ]]; then
                    echo '::warning::Coding benchmark generation command failed; any retained artifact may be stale. Provider publication will continue.'
                  fi
                  uv run python - "$RUNNER_TEMP/model-output/benchmarks" <<'PY'
                  import json
                  import pathlib
                  import sys

                  # Never interpolate source text into a workflow command.
                  root = pathlib.Path(sys.argv[1])
                  documents = []
                  for filename in ("coding.json", "coding-audit.json"):
                      try:
                          value = json.loads((root / filename).read_text(encoding="utf-8"))
                          if (
                              not isinstance(value, dict)
                              or type(value.get("schemaVersion")) is not int
                              or value["schemaVersion"] not in (2, 3)
                          ):
                              raise ValueError("Invalid evidence wrapper")
                      except (OSError, ValueError, TypeError):
                          value = {}
                      documents.append(value)
                  main, audit = documents
                  if not main or not audit:
                      print("::warning::Coding evidence main/audit artifact unreadable")
                  if any(document.get("status") != "success" for document in documents):
                      print(
                          "::warning::Coding evidence generation failed or unreadable; "
                          "inspect benchmarks/coding.json and coding-audit.json"
                      )
                  if any(
                      document.get("status") == "success"
                      and document.get("schemaVersion") != 3
                      for document in documents
                  ):
                      print(
                          "::warning::Coding artifact success uses an outdated schema; "
                          "new successful main/audit artifacts must use schema 3"
                      )
                  generation_id = main.get("generationId")
                  if (
                      not isinstance(generation_id, str)
                      or not generation_id
                      or generation_id != audit.get("generationId")
                      or main.get("schemaVersion") != audit.get("schemaVersion")
                  ):
                      print("::warning::Coding evidence main/audit generation mismatch")
                  states = main.get("sourceStates")
                  if isinstance(states, dict):
                      states = list(states.values())
                  if not isinstance(states, list) or not states or any(
                      not isinstance(state, dict) or state.get("status") != "success"
                      for state in states
                  ):
                      print(
                          "::warning::Coding evidence source failed or unavailable; "
                          "inspect sourceStates even when generation succeeded"
                      )
                  if audit.get("issues"):
                      print(
                          "::warning::Coding evidence audit has issues; "
                          "inspect benchmarks/coding-audit.json"
                      )
                  PY
            - name: Report providers that failed
              run: |
                  uv run python - "$RUNNER_TEMP/model-output" <<'PY'
                  import json
                  import pathlib
                  import sys

                  # Only the wrapper top level is read, so a model object that
                  # mentions status cannot be mistaken for a failed provider.
                  # Any other value is replaced before printing, because it comes
                  # off the remote branch into a workflow command line.
                  for path in sorted(pathlib.Path(sys.argv[1]).glob("*.json")):
                      try:
                          status = json.loads(path.read_text(encoding="utf-8"))["status"]
                      except Exception:
                          status = None
                      if status not in ("success", "failed"):
                          status = "unreadable"
                      if status != "success":
                          print(f"::warning::{path.stem} fetch failed ({status})")
                  PY
            - name: Publish model data on isolated branch
              if: success() && steps.seed.outcome == 'success' && steps.fetch.outcome == 'success'
              run: |
                  data_worktree="$RUNNER_TEMP/models-data-worktree"
                  mkdir -p "$RUNNER_TEMP/model-output"
                  remote_branch=$(git ls-remote --heads origin refs/heads/models-data)
                  if [[ -n "$remote_branch" ]]; then
                    git fetch origin +refs/heads/models-data:refs/remotes/origin/models-data
                    git worktree add -b models-data "$data_worktree" refs/remotes/origin/models-data
                  else
                    git worktree add --detach "$data_worktree" HEAD
                    git -C "$data_worktree" checkout --orphan models-data
                    git -C "$data_worktree" rm -rf --ignore-unmatch .
                  fi

                  cd "$data_worktree"
                  # Older data-branch commits, if any, must not leave non-data files behind.
                  git ls-files -z | while IFS= read -r -d '' path; do
                    if [[ "$path" != data/* ]]; then
                      git rm -f -- "$path"
                    fi
                  done
                  mkdir -p data
                  # No --delete: keeping a failed provider's last good file is the
                  # script's job, and this covers a run that died before it could
                  # record the failure at all.
                  rsync -a "$RUNNER_TEMP/model-output/" data/
                  uv run --project "$GITHUB_WORKSPACE" python - "$GITHUB_WORKSPACE/config/providers.json" data <<'PY'
                  import json
                  import pathlib
                  import re
                  import sys

                  # Prune only what the catalogue proves is obsolete. An unreadable,
                  # unusable or empty catalogue keeps every published file in place
                  # rather than wiping the data branch.
                  try:
                      raw = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
                      entries = json.loads(raw)
                  except Exception as error:
                      print(f"config/providers.json is unusable, keeping all data files: {error}")
                      raise SystemExit(0)
                  # An entry the fetch script would have refused cannot be used as
                  # proof that its provider was removed on purpose.
                  usable = (
                      isinstance(entry, dict)
                      and isinstance(entry.get("id"), str)
                      and re.fullmatch(r"[a-z0-9][a-z0-9_-]*", entry["id"])
                      for entry in entries
                  )
                  if not isinstance(entries, list) or not all(usable):
                      print("config/providers.json has an unusable entry, keeping all data files")
                      raise SystemExit(0)
                  if not entries:
                      print("config/providers.json lists no providers, keeping all data files")
                      raise SystemExit(0)
                  configured = {entry["id"] for entry in entries}
                  # Nested benchmark artifacts are not provider files and stay intact.
                  for stale in pathlib.Path(sys.argv[2]).glob("*.json"):
                      if stale.stem not in configured:
                          stale.unlink()
                  PY
                  git add -A
                  if git diff --cached --quiet; then
                    echo 'No model data changes to commit.'
                    exit 0
                  fi
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git commit -m 'Update free model data'
                  git push origin HEAD:refs/heads/models-data
